appId: com.engecom.golias
productName: GOLIAS
directories:
  output: ../../release
files:
  - dist/**
  - dist-electron/**
  - build/icon.png
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
# Feed de auto-update (electron-updater) — releases publicadas no GitHub do
# repositório. Precisa de um "latest.yml" + o instalador anexados à release,
# publicados via `electron-builder --publish always` (variável GH_TOKEN).
publish:
  provider: github
  owner: programas-CAE
  repo: golias
